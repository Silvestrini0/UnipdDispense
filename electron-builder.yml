appId: com.moodlescraper.app
productName: UnipdDispense
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
publish:
  provider: github
  owner: Silvestrini0
  repo: UnipdDispense
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
linux:
  maintainer: Silvestrini0
  target:
    - AppImage
    - deb
    - rpm
  category: Education
  syncDesktopName: true
  icon: resources/icon.png
  artifactName: UnipdDispense-Linux-${version}-${arch}.${ext}
win:
  target:
    - nsis
  icon: resources/icon.png
  artifactName: UnipdDispense-Windows-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  # Ad-hoc signing preserves bundle integrity; Mac updates use the app's GitHub updater.
  identity: '-'
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.education
  artifactName: UnipdDispense-macOS-${version}-${arch}.${ext}

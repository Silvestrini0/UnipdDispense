appId: com.moodlescraper.app
productName: UnipdDispense
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
linux:
  maintainer: Silvestrini0
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Education
  syncDesktopName: true
  icon: resources/icon.png
  artifactName: UnipdDispense-${version}-${arch}.${ext}
win:
  target:
    - nsis
    - zip
  icon: resources/icon.png
  artifactName: UnipdDispense-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  # Re-sign the packaged Electron bundle even without an Apple certificate.
  # Otherwise its original linker signature is invalid after packaging on arm64.
  identity: '-'
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.education
  artifactName: UnipdDispense-${version}-${arch}.${ext}
